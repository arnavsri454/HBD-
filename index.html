<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>A Little Surprise ❤️</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="password.css">

</head>

<body>

    <div class="password-page">

        <div class="password-card">

            <div class="top-heart">
                ❤️
            </div>

            <h1>
                A Little Surprise
            </h1>

            <h2>
                For Anvesha
            </h2>

            <p class="intro">
                There is something waiting for you...
            </p>


            <div class="password-box">

                <input
                    type="password"
                    id="passwordInput"
                    placeholder="Enter the secret"
                    autocomplete="off">

                <button id="passwordBtn">
                    Unlock ❤️
                </button>

            </div>


            <p id="passwordError"></p>


            <div class="hint">

                <span>💡</span>

                <p>
                    Hint:
                    <span id="hintText">
                        The Precious name of mine given by your wisdom
                    </span>
                </p>

            </div>


            <div class="divider"></div>


            <div class="countdown">

                <p class="countdown-title">
                    Until your special day ✨
                </p>

                <div class="timer">

                    <div>
                        <span id="days">00</span>
                        <small>Days</small>
                    </div>

                    <div>
                        <span id="hours">00</span>
                        <small>Hours</small>
                    </div>

                    <div>
                        <span id="minutes">00</span>
                        <small>Minutes</small>
                    </div>

                    <div>
                        <span id="seconds">00</span>
                        <small>Seconds</small>
                    </div>

                </div>

            </div>


            <p class="made-with">
                Made with ❤️ by Arnav
            </p>

        </div>

    </div>


    <script src="password.js"></script>

</body>

</html>
